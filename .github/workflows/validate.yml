name: Validate graphic design showcase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML document structure
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t html_files < <(find . -path './.git' -prune -o -name '*.html' -type f -print)
          if [ "${#html_files[@]}" -eq 0 ]; then
            echo "No HTML documents found."
            exit 1
          fi
          for file in "${html_files[@]}"; do
            test -s "$file"
            grep -qi '<!doctype html' "$file"
            grep -qi '<html' "$file"
            grep -qi '</html>' "$file"
          done
          echo "Validated ${#html_files[@]} HTML document(s)."
